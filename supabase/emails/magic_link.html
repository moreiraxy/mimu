<!doctype html>
<html lang="pt-BR">
<body style="margin:0;padding:0;background:#F2F1EE;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F2F1EE;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E6E4DF;border-radius:18px;">
      <tr><td style="padding:36px 32px 0 32px;"><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td width="52" height="52" align="center" valign="middle" style="width:52px;height:52px;background:#CCFF00;border-radius:15px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:27px;font-weight:800;line-height:52px;color:#0A0A0A;letter-spacing:-0.02em;">M</td>
  </tr></table></td></tr>
      
      <tr><td style="padding:22px 32px 0 32px;">
        <h1 style="margin:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:24px;line-height:1.25;letter-spacing:-0.02em;font-weight:700;color:#0A0A0A;">Seu link de acesso</h1>
      </td></tr>
      <tr><td style="padding:12px 32px 0 32px;">
        <p style="margin:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#57564F;">Toque no botão abaixo para entrar na Mimu. O link vale por uma hora e só funciona uma vez.</p>
      </td></tr>
      <tr><td style="padding:28px 32px 0 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td style="background:#CCFF00;border-radius:999px;">
            <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&amp;type=magiclink" style="display:inline-block;padding:14px 28px;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#0A0A0A;text-decoration:none;">Entrar na Mimu</a>
          </td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:22px 32px 0 32px;">
        <p style="margin:0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#8A8880;">Se o botão não abrir, <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&amp;type=magiclink" style="color:#57564F;">use este link</a>.</p>
      </td></tr>
      <tr><td style="padding:26px 32px 32px 32px;">
        <div style="height:1px;background:#EEECE7;font-size:0;line-height:0;">&nbsp;</div>
        <p style="margin:18px 0 0 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#8A8880;">Se não foi você que pediu, pode ignorar esta mensagem.</p>
      </td></tr>
    </table>
    <p style="margin:20px 0 0 0;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#A3A199;">Mimu, sua assistente de negócio</p>
  </td></tr>
</table>
</body></html>
