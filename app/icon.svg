<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    O ÍCONE EM GRAFITE.

    "atualiza a logo do aparelho móvel e as logos do navegador q aparece lá em
    cima" — o néon #CCFF00 era a identidade do produto antigo, e ela pediu o
    sistema inteiro em preto e branco. O "M" continua o mesmo traço; o que muda
    é a cor da placa e do traço.

    Grafite escuro com traço branco, e não o contrário, por um motivo prático:
    o ícone aparece na aba do navegador e na tela de início, sobre fundos que
    podem ser claros ou escuros. Uma placa escura se separa dos dois; uma placa
    branca desaparece no tema claro do Safari e do Chrome.
  -->
  <rect width="512" height="512" rx="112" fill="#1A1A1A" />
  <path
    d="M106 249.5 L106 143.5 Q106 106 143.75 106 Q181.5 106 193.75 143.5 L256 249.5 L318.25 143.5 Q330.5 106 368.25 106 Q406 106 406 143.5 L406 249.5"
    stroke="#FFFFFF"
    stroke-width="31.25"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
