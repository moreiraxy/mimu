<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      PNG antes do SVG de propósito. Navegador guarda favicon de forma
      agressiva: mudar o conteúdo do /icon.svg mantendo o mesmo caminho não
      surtia efeito, e a aba continuava com o ícone da marca antiga. Os
      arquivos abaixo têm nome novo, então são buscados do zero.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <!-- Verde neon Mimu: pinta a barra do navegador no Android e a status bar da PWA. -->
    <meta name="theme-color" content="#0A0A0A" />
    <title>Mimu · seu negócio, organizado</title>
    <meta
      name="description"
      content="Assistente de gestão para microempreendedores de bairro: vendas, faturamento, agenda e clientes em um só lugar. Enquanto você trabalha, a Mimu cuida do seu negócio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Mimu" />
    <meta property="og:title" content="Mimu · seu negócio, organizado" />
    <meta
      property="og:description"
      content="Assistente de gestão para microempreendedores de bairro: vendas, faturamento, agenda e clientes em um só lugar. Enquanto você trabalha, a Mimu cuida do seu negócio."
    />
    <!--
      Imagem que aparece quando o link é compartilhado. Precisa ser absoluta:
      WhatsApp e redes buscam essa URL de fora, e caminho relativo não resolve
      para elas.
    -->
    <meta property="og:image" content="https://mimu.up.railway.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mimu: enquanto você trabalha, a Mimu cuida do seu negócio." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mimu.up.railway.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="max-image-preview:large" />

    <!--
      Só o que está acima da dobra. O Nunito saiu (era o único preload de fonte
      local): a tipografia agora vem do Google Fonts (Geist/Geist Mono/Indie
      Flower), carregada pelo <link rel="stylesheet"> acima.
      O srcset/sizes da imagem tem que continuar idêntico ao que o <Img> emite
      para esse arquivo, senão o browser pré-carrega um candidato e busca outro.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      href="/img/TSJEmo3HFim46DqBxHZOxuASA-960.avif"
      imagesrcset="/img/TSJEmo3HFim46DqBxHZOxuASA-480.avif 480w, /img/TSJEmo3HFim46DqBxHZOxuASA-960.avif 960w, /img/TSJEmo3HFim46DqBxHZOxuASA-1365.avif 1365w"
      imagesizes="(max-width: 743px) 100vw, 773px"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
