<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      PNG antes do SVG de propósito. Navegador guarda favicon de forma
      agressiva: mudar o conteúdo do /icon.svg mantendo o mesmo caminho não
      surtia efeito, e a aba continuava com o ícone da marca antiga. Os
      arquivos abaixo têm nome novo, então são buscados do zero.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <!--
      O manifesto é o que dá nome e ícone ao app quando o navegador oferece
      instalar, e é dele que sai a marca mostrada junto do nome no desktop.
      As páginas do app (Next) já declaravam; esta, que é HTML estático vindo
      do build da landing, não declarava — então quem chegava pela home via a
      identidade antiga do navegador em vez da nossa.
    -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Verde neon Mimu: pinta a barra do navegador no Android e a status bar da PWA. -->
    <meta name="theme-color" content="#0A0A0A" />
    <!--
      Canonical: diz ao Google qual é o endereço oficial desta página.
      Sem ele, "/" e "//" e qualquer variação com parâmetro (?sair=1, utm_...)
      são tratados como páginas diferentes com o mesmo conteúdo, e o Google
      escolhe sozinho qual mostrar.
    -->
    <link rel="canonical" href="https://mimu.pro/" />

    <!--
      Verificação do Search Console. O Google busca esta tag no HTML CRU, sem
      executar JavaScript, então ela precisa estar aqui no index.html e não
      num componente React.
    -->
    <meta name="google-site-verification" content="dO_6eMhvDr5-rfexSs8GxNEMYJNPcI-AmWgoqY0jNtY" />

    <!--
      Dados estruturados: o que a Mimu e, quem publica e quanto custa, em
      formato que o buscador le sem executar JavaScript. E por enquanto a
      unica informacao de verdade que ele consegue extrair desta pagina,
      porque o corpo do HTML vem vazio e so ganha conteudo depois do React
      montar.

      Sem nota e sem numero de avaliacoes de proposito: inventar isso e
      violacao das diretrizes do Google, alem de mentira.
    -->
    <script type="application/ld+json">
{
            "@context": "https://schema.org",
            "@graph": [
                  {
                        "@type": "Organization",
                        "@id": "https://mimu.pro/#organizacao",
                        "name": "Mimu",
                        "url": "https://mimu.pro/",
                        "logo": "https://mimu.pro/icons/icon-512.png",
                        "description": "Plataforma de gestão para comércios de bairro: agenda, financeiro, clientes e estoque, com uma assistente que responde perguntas sobre o negócio.",
                        "sameAs": [
                              "https://www.instagram.com/mimu.ia/"
                        ]
                  },
                  {
                        "@type": "WebSite",
                        "@id": "https://mimu.pro/#site",
                        "url": "https://mimu.pro/",
                        "name": "Mimu",
                        "inLanguage": "pt-BR",
                        "publisher": {
                              "@id": "https://mimu.pro/#organizacao"
                        }
                  },
                  {
                        "@type": "SoftwareApplication",
                        "name": "Mimu",
                        "applicationCategory": "BusinessApplication",
                        "operatingSystem": "Web, Android, iOS",
                        "inLanguage": "pt-BR",
                        "description": "Assistente de gestão para microempreendedores de bairro: vendas, faturamento, agenda, clientes e estoque em um só lugar.",
                        "publisher": {
                              "@id": "https://mimu.pro/#organizacao"
                        },
                        "offers": {
                              "@type": "AggregateOffer",
                              "priceCurrency": "BRL",
                              "lowPrice": "39",
                              "highPrice": "199",
                              "offerCount": "2",
                              "availability": "https://schema.org/InStock"
                        }
                  }
            ]
      }
    </script>

    <title>Mimu · seu negócio, organizado</title>
    <meta
      name="description"
      content="Assistente de gestão para microempreendedores de bairro: vendas, faturamento, agenda e clientes em um só lugar. Enquanto você trabalha, a Mimu cuida do seu negócio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Mimu" />
    <meta property="og:title" content="Mimu · seu negócio, organizado" />
    <meta
      property="og:description"
      content="Assistente de gestão para microempreendedores de bairro: vendas, faturamento, agenda e clientes em um só lugar. Enquanto você trabalha, a Mimu cuida do seu negócio."
    />
    <!--
      Imagem que aparece quando o link é compartilhado. Precisa ser absoluta:
      WhatsApp e redes buscam essa URL de fora, e caminho relativo não resolve
      para elas.
    -->
    <meta property="og:image" content="https://mimu.pro/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mimu: enquanto você trabalha, a Mimu cuida do seu negócio." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://mimu.pro/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="max-image-preview:large" />

    <!--
      Só o que está acima da dobra. O Nunito saiu (era o único preload de fonte
      local): a tipografia agora vem do Google Fonts (Geist/Geist Mono/Indie
      Flower), carregada pelo <link rel="stylesheet"> acima.
      O srcset/sizes da imagem tem que continuar idêntico ao que o <Img> emite
      para esse arquivo, senão o browser pré-carrega um candidato e busca outro.
    -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      href="/img/TSJEmo3HFim46DqBxHZOxuASA-960.avif"
      imagesrcset="/img/TSJEmo3HFim46DqBxHZOxuASA-480.avif 480w, /img/TSJEmo3HFim46DqBxHZOxuASA-960.avif 960w, /img/TSJEmo3HFim46DqBxHZOxuASA-1365.avif 1365w"
      imagesizes="(max-width: 743px) 100vw, 773px"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
